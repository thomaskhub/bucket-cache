# Example configuration. Secret values are never written here: each secret is
# a {file: ...} reference to a Docker secret mounted under /run/secrets.

server:
  data_listen: ":8080"          # object access and git (build network)
  admin_listen: ":8081"         # UI, /api/v1, /metrics (keep internal)
  public_base_url: "http://cache.example.lan:8080"
  tls: { cert_file: "", key_file: "" }   # empty = plain HTTP, or TLS from a reverse proxy

auth:
  bootstrap_admin_key:    { file: /run/secrets/admin_api_key }
  initial_admin_user:     { file: /run/secrets/initial_admin_user }      # used only when no users exist
  initial_admin_password: { file: /run/secrets/initial_admin_password }
  db_encryption_key:      { file: /run/secrets/db_encryption_key }       # encrypts TOTP secrets
  token_default_ttl: 12h
  token_max_ttl: 72h

storage:
  db_path: /data/proxy.db
  cache_root: /cache

buckets:
  - alias: sstate
    provider: rustfs
    endpoint: http://rustfs.lan:9000
    bucket: yocto-sstate
    credentials:
      access_key_id:     { file: /run/secrets/rustfs_access_key }
      secret_access_key: { file: /run/secrets/rustfs_secret_key }
    mode: passthrough            # backend is on the LAN; no local copy

  - alias: sstate-cloud
    provider: r2
    endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com
    bucket: yocto-sstate
    credentials:
      access_key_id:     { file: /run/secrets/r2_access_key }
      secret_access_key: { file: /run/secrets/r2_secret_key }
    mode: cache
    cache:
      max_size: 200GiB
      freshness: immutable
      negative_ttl: 30s
      serve_stale: true

git:
  storage: /git                 # own volume; also holds git's HOME (.home) and temp files (.tmp)
  max_size: 300GiB              # least recently used mirrors are evicted above this
  evict_after: 90d              # mirrors not used for this long are removed
  # max_concurrency: 0          # upload-pack processes at once (0 = 4 per CPU, at least 8)
  # fetch_timeout: 30m          # one upstream clone or fetch
  # maintenance_interval: 1h    # git maintenance run --auto, then eviction
  remotes:
    - name: github              # served at /git/github/{owner}/{repo}.git
      url: https://github.com
      credentials:
        token: { file: /run/secrets/github_token }   # or a GitHub App:
        # app_id: "123456"
        # app_private_key: { file: /run/secrets/github_app_key }
      allow: ["acme/*", "yoctoproject/poky", "openembedded/*"]
      # seed: ["yoctoproject/poky"]   # mirrored at start-up
      refresh_interval: 10m     # background check of every mirror
      ls_remote_cache: 3s       # freshness check result reused this long
      upstream_timeout: 3s      # after this the stale mirror is served
      prune: true
      include_pull_refs: false

metrics:
  bearer_token: { file: /run/secrets/metrics_token }

log:
  level: info
