<h1 class="h1">Buckets</h1>
<section class="card mb-6">
  <p x-show="error" class="alert alert-error" x-text="error"></p>
  <p x-show="!loading && buckets.length === 0" class="text-slate-500 text-sm">No buckets are configured.</p>
  <div class="overflow-x-auto" x-show="buckets.length > 0">
    <table class="table">
      <thead><tr><th>Alias</th><th>Provider</th><th>Endpoint</th><th>Bucket</th><th>Prefix</th><th>Mode</th><th>Connection</th></tr></thead>
      <tbody>
        <template x-for="b in buckets" :key="b.alias">
          <tr>
            <td class="font-medium" x-text="b.alias"></td>
            <td x-text="b.provider"></td>
            <td class="text-xs" x-text="b.endpoint"></td>
            <td x-text="b.bucket"></td>
            <td x-text="b.prefix"></td>
            <td><span class="badge" x-text="b.mode"></span></td>
            <td class="whitespace-nowrap">
              <button type="button" class="btn btn-secondary btn-sm" x-show="canTest()" :disabled="isTesting(b)" @click="test(b)">Test</button>
              <span x-show="hasResult(b)" :class="resultClass(b)" x-text="resultText(b)"></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <p class="mt-3 text-xs text-slate-500">Credentials are never shown. Edit buckets in the config file.</p>
</section>

<template x-for="b in cached()" :key="b.alias">
  <section class="card mb-6" :data-cache="b.alias">
    <h2 class="h2">Cache: <span x-text="b.alias"></span></h2>
    <p x-show="statsError(b)" class="alert alert-error" x-text="statsError(b)"></p>
    <div x-show="hasStats(b)">
      <div class="mb-4">
        <div class="flex justify-between text-sm mb-1"><span>Disk usage</span><span data-stat="usage" x-text="usage(b)"></span></div>
        <meter class="w-full" min="0" :max="st(b).max_size" :value="st(b).size"></meter>
      </div>
      <div class="grid grid-cols-2 gap-4 md:grid-cols-4">
        <div class="stat"><span class="stat-label">Objects</span><span class="stat-value" data-stat="objects" x-text="st(b).objects"></span></div>
        <div class="stat"><span class="stat-label">Hit ratio</span><span class="stat-value" data-stat="ratio" x-text="ratio(b)"></span></div>
        <div class="stat"><span class="stat-label">Hits / stale / misses</span>
          <span class="stat-value text-lg"><span x-text="st(b).hits"></span> / <span x-text="st(b).stale"></span> / <span x-text="st(b).misses"></span></span></div>
        <div class="stat"><span class="stat-label">Bytes saved</span><span class="stat-value" x-text="bytes(st(b).bytes_saved)"></span></div>
        <div class="stat"><span class="stat-label">Evictions</span><span class="stat-value" x-text="st(b).evictions"></span></div>
        <div class="stat"><span class="stat-label">Filling now</span><span class="stat-value" x-text="st(b).filling"></span></div>
        <div class="stat"><span class="stat-label">Freshness</span><span class="stat-value text-lg" x-text="st(b).freshness"></span></div>
      </div>
      <p class="mt-2 text-xs text-slate-500">Counters are since the proxy started.</p>
    </div>

    <div x-show="isAdmin()" class="mt-4 border-t border-slate-200 pt-4" x-data="{ prefix: '', key: '' }">
      <h3 class="mb-2 text-sm font-semibold">Purge</h3>
      <div class="flex flex-wrap items-end gap-3">
        <label class="field"><span>Prefix</span><input class="input" name="purge-prefix" x-model="prefix" placeholder="e.g. universal/ab/"></label>
        <button type="button" class="btn btn-secondary" data-action="purge-prefix" :disabled="isPurging(b)" @click="purge(b, 'prefix', prefix)">Purge prefix</button>
        <label class="field"><span>Key</span><input class="input" name="purge-key" x-model="key" placeholder="exact object key"></label>
        <button type="button" class="btn btn-secondary" data-action="purge-key" :disabled="isPurging(b)" @click="purge(b, 'key', key)">Purge key</button>
        <button type="button" class="btn btn-danger" data-action="purge-all" :disabled="isPurging(b)" @click="purge(b, '', '')" x-text="allLabel(b)"></button>
      </div>
      <p x-show="msg(b)" class="alert alert-success mt-3" data-purge="result" x-text="msg(b)"></p>
      <p x-show="err(b)" class="alert alert-error mt-3" x-text="err(b)"></p>
    </div>
  </section>
</template>
