# Release (M6, SEC-23): on a version tag, push the multi-arch image to GHCR
# with SBOM and provenance attestations, sign it with cosign (keyless), and
# publish static binaries with their SBOM on the GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub release
  packages: write   # GHCR
  id-token: write   # cosign keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/thomaskhub/bucket-cache/internal/version.Version=${GITHUB_REF_NAME} -X github.com/thomaskhub/bucket-cache/internal/version.Commit=${GITHUB_SHA}" \
              -o yproxy ./cmd/yproxy
            tar czf dist/yproxy-${GITHUB_REF_NAME}-linux-$arch.tar.gz yproxy LICENSE NOTICE THIRD_PARTY_LICENSES.csv
          done
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod app -json -licenses -main cmd/yproxy -output dist/yproxy-${GITHUB_REF_NAME}.cdx.json .
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
